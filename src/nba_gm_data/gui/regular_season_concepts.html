<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NBA GM Regular Season Dashboard Concepts</title>
  <style>
    :root {

    * { box-sizing: border-box; font-weight: 400; }

    button, select { color: inherit; font: inherit; }

    .staff-strip-item { align-content: center; border-right: 1px solid #2b373e; display: grid; gap: 5px; padding: 8px 10px; }

    .staff-strip-item strong { font: 400 12px ui-monospace,SFMono-Regular,Menlo,monospace; }

    .dev-hybrid-list { display: grid; height: calc(100% - 42px); padding: 7px 10px; }
    .dev-hybrid-row { align-items: center; border-bottom: 1px solid #263137; display: grid; gap: 8px; grid-template-columns: 104px 70px minmax(0,1fr) 34px; }
    .dev-hybrid-row:last-child { border-bottom: 0; }
    .dev-hybrid-row span, .dev-hybrid-row em { font-size: 10px; font-style: normal; white-space: nowrap; }
    .dev-hybrid-row em { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; text-align: right; }
    .dev-spark { height: 20px; width: 70px; }
    .dev-spark polyline { fill: none; stroke: #aab6bb; stroke-width: 1.6; }
    .dev-lollipop { height: calc(100% - 42px); width: 100%; }
    .dev-lollipop .axis { stroke: #56636a; }
    .dev-lollipop .gridline { stroke: #253036; }
    .dev-lollipop text { fill: #aab5ba; font: 400 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .dev-lollipop .stem { stroke: #55636a; stroke-width: 1; }
    .dev-lollipop .positive { fill: var(--good); }
    .dev-lollipop .negative { fill: var(--bad); }
    .dev-small-grid { display: grid; gap: 6px; grid-template-columns: 1fr 1fr; height: calc(100% - 42px); padding: 7px; }
    .dev-small { border-bottom: 1px solid #29343a; display: grid; gap: 4px; grid-template-columns: minmax(0,1fr) 44px; grid-template-rows: 20px minmax(0,1fr); padding: 4px 6px; }
    .dev-small span, .dev-small em { font-size: 10px; font-style: normal; }
    .dev-small em { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; text-align: right; }
    .dev-small svg { grid-column: 1/3; height: 100%; width: 100%; }
    .dev-small polyline { fill: none; stroke: #b9c5ca; stroke-width: 2; }
    .dev-small line { stroke: #2b373e; }
    .concept-m, .concept-n, .concept-o { grid-template-columns: repeat(12,1fr); grid-template-rows: 338px minmax(0,1fr); }
    .concept-m .identity-v3, .concept-n .identity-v3, .concept-o .identity-v3 { grid-column: 1/7; grid-row: 1; }
    .concept-m .standings, .concept-n .standings, .concept-o .standings { grid-column: 7/10; grid-row: 1; }
    .concept-m .top-right, .concept-n .top-right, .concept-o .top-right { grid-column: 10/13; grid-row: 1; grid-template-rows: 112px minmax(0,1fr); }
    .concept-m .minutes-panel, .concept-n .minutes-panel, .concept-o .minutes-panel { grid-column: 1/9; grid-row: 2; }
    .concept-m .development-v3, .concept-n .development-v3, .concept-o .development-v3 { grid-column: 9/13; grid-row: 2; }
    .concept-m .standings th, .concept-m .standings td, .concept-n .standings th, .concept-n .standings td, .concept-o .standings th, .concept-o .standings td { height: 22px; }
    .concept-m .standings table, .concept-m .minutes-v3 { height: calc(100% - 42px); }
    .concept-m .standings th, .concept-m .standings td, .concept-m .minutes-v3 th, .concept-m .minutes-v3 td { height: auto; }
    .concept-m .minutes-v3 tr.injured-row td, .concept-m .minutes-v3 tr.injured-row span, .concept-m .minutes-v3 tr.injured-row em { color: var(--bad); }
    .concept-m .timeline-day em { min-height: 11px; white-space: nowrap; }
    .concept-m .ticker .button { background: var(--ink); color: var(--bg); opacity: 1; }
    .concept-n .panel { border-radius: 4px; }
    .concept-n .signal-track, .concept-n .assignment-meter > i { border-radius: 3px; }
    .concept-n .staff-rows-v3 table th, .concept-n .staff-rows-v3 table td { height: 26px; }
    .concept-o .identity-v3-body { grid-template-columns: minmax(0,1.75fr) minmax(225px,.85fr); }
    .concept-o .staff-strip-v3 { grid-template-columns: 1fr 1fr; }
    .concept-o .staff-strip-item:nth-child(2) { border-right: 0; }
    .concept-o .staff-strip-item:nth-child(-n+2) { border-bottom: 1px solid #2b373e; }
    .concept-o .dev-small-grid { gap: 4px; padding: 5px; }
    .concept-o .dev-small { padding: 2px 5px; }
  </style>
</head>
<body>
  <main class="gallery">
    <header class="gallery-head">
      <div><h1>Regular Season Dashboard Studies</h1><p>Fifteen information architectures · component and layout exploration · 1440 × 900</p></div>
      <nav class="gallery-nav" id="nav"></nav>
    </header>
    <div id="concepts"></div>
  </main>
  <script>
    const logo = (team, size="") => `<img class="logo ${size}" src="assets/team_logos/${team}.png" alt="${team}" />`;
    const button = (text, cls="") => `<button class="button ${cls}">${text}</button>`;
    const header = (center="REGULAR SEASON", showRecord=true) => `<header class="screen-head"><div class="brand">${logo("WAS")}<div><div class="display">Washington Wizards</div>${showRecord?`<div class="sub">28–19 · 5th East</div>`:""}</div></div><div class="center"><div class="label">${center}</div><div class="mono" style="font-size:11px;margin-top:3px">January 28, 2027</div></div><div class="actions">${button("Trade Room")}${button("Player Finder")}${button("Prospects")}${button("Settings","icon")}</div></header>`;
    const panel = (title, body, cls="", actions="") => `<section class="panel ${cls}"><div class="panel-head"><h2>${title}</h2><div class="panel-actions">${actions}</div></div>${body}</section>`;
    const add = (num, name, body) => { const section=document.createElement("section"); section.className="concept"; section.id=`concept-${num}`; section.innerHTML=`<div class="concept-label"><span>CONCEPT ${num} · ${name.toUpperCase()}</span><button class="copy" data-copy="artboard-${num}">Copy editable HTML</button></div><article class="artboard" id="artboard-${num}" layer-name="Concept ${num} - ${name}">${body}</article>`; document.getElementById("concepts").append(section); const link=document.createElement("a"); link.href=`#concept-${num}`; link.textContent=num; document.getElementById("nav").append(link); };
    const panelGrid = values => values.map(([name, value, rank]) => `<div class="metric-row"><span>${name}</span><i class="track"><i style="width:${value}%"></i></i><em>#${rank}/30</em></div>`).join("");
    const radar = (labels, values) => { const polygon=(scale=1)=>values.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length;return `${100+Math.cos(a)*66*scale},${83+Math.sin(a)*62*scale}`}).join(" "); const shape=values.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length;return `${100+Math.cos(a)*66*v/100},${83+Math.sin(a)*62*v/100}`}).join(" "); return `<svg class="radar" viewBox="0 0 200 166">${[.25,.5,.75,1].map(s=>`<polygon class="grid" points="${polygon(s)}"/>`).join("")}${values.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length;return `<line x1="100" y1="83" x2="${100+Math.cos(a)*66}" y2="${83+Math.sin(a)*62}"/>`}).join("")}<polygon class="shape" points="${shape}"/>${labels.map((label,i)=>{const a=-Math.PI/2+i*Math.PI*2/labels.length;return `<text text-anchor="middle" x="${100+Math.cos(a)*87}" y="${86+Math.sin(a)*75}">${label}</text>`}).join("")}</svg>`; };
    const diagnosticRadar = (labels, values, healthy, kind) => {
      const polygon = (numbers, scale=1) => numbers.map((v,i) => {
        const a=-Math.PI/2+i*Math.PI*2/numbers.length;
        return `${100+Math.cos(a)*66*(v/100)*scale},${83+Math.sin(a)*62*(v/100)*scale}`;
      }).join(" ");
      const healthyShape = healthy ? `<polygon class="shape-healthy" points="${polygon(healthy)}"/>` : "";
      return `<svg class="radar" viewBox="0 0 200 166">${[.25,.5,.75,1].map(s=>`<polygon class="grid" points="${labels.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/labels.length;return `${100+Math.cos(a)*66*s},${83+Math.sin(a)*62*s}`}).join(" ")}"/>`).join("")}${labels.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/labels.length;return `<line x1="100" y1="83" x2="${100+Math.cos(a)*66}" y2="${83+Math.sin(a)*62}"/>`}).join("")}<polygon class="shape-${kind}" points="${polygon(values)}"/>${healthyShape}${labels.map((label,i)=>{const a=-Math.PI/2+i*Math.PI*2/labels.length;return `<text text-anchor="middle" x="${100+Math.cos(a)*87}" y="${86+Math.sin(a)*75}">${label}</text>`}).join("")}</svg>`;
    };
    const conceptSpatialHeatmap = () => `<div class="identity-v3-heat"><div class="identity-v3-heat-head"><span>Offense</span><span>Defense</span></div><svg viewBox="0 0 520 95" aria-label="Rotation-weighted offensive and defensive court heatmap"><rect class="court-floor" x="1" y="1" width="518" height="93"/><line class="court-line" x1="260" y1="1" x2="260" y2="94"/><circle class="court-line" cx="260" cy="47.5" r="13"/><path class="court-line" d="M1 22h45v51H1M519 22h-45v51h45M1 32h17v31H1M519 32h-17v31h17"/><path class="court-line" d="M46 25a34 34 0 0 1 0 45M474 25a34 34 0 0 0 0 45"/>${[[32,48,18,"#ff515f"],[88,47,21,"#ff8648"],[154,20,18,"#f0d44c"],[207,24,19,"#26e98f"],[211,71,16,"#26e98f"],[488,48,19,"#26e98f"],[430,46,21,"#26e98f"],[365,22,17,"#f0d44c"],[311,25,18,"#ff8648"],[308,72,15,"#ff515f"]].map(s=>`<circle cx="${s[0]}" cy="${s[1]}" r="${s[2]}" fill="${s[3]}" opacity=".34"/>`).join("")}</svg><div class="identity-v3-heat-legend"><span>Low threat · High threat</span><span>Vulnerable · Strong suppression</span></div></div>`;
    const teamDiagnostic = () => panel("Team Diagnostics", `<div class="diagnostic-summary"><div class="diagnostic-cell good"><span>Overall</span><em>#9/30</em><strong>78.4</strong></div><div class="diagnostic-cell good"><span>Offense</span><em>#6/30</em><strong>81.7</strong></div><div class="diagnostic-cell warn"><span>Defense</span><em>#13/30</em><strong>73.2</strong></div><div class="diagnostic-cell warn"><span>Depth</span><em>#10/30</em><strong>75.8</strong></div></div><div class="diagnostic-radars"><div class="radar-wrap"><span class="radar-title">Offensive Shape</span>${diagnosticRadar(["SHOT #8","RANGE #11","RIM #5","CREATE #4","PASS #7","PACE #18"],[76,67,83,88,78,49],[77,69,83,89,79,50],"offense")}<div class="radar-key"><span><i></i>Active</span><span><i class="healthy"></i>Healthy</span></div></div><div class="radar-wrap"><span class="radar-title">Defense + Roster</span>${diagnosticRadar(["POINT #12","WING #3","RIM #15","REBOUND #20","ATH #6","DEPTH #9"],[64,91,54,40,82,71],[69,92,60,43,83,76],"defense")}<div class="radar-key"><span><i></i>Active</span><span><i class="healthy"></i>Healthy</span></div></div></div>`, "diagnostic", button("Compare"));
    const identity = () => panel("Team Identity", `<div class="radar-pair"><div class="radar-wrap"><span class="radar-title">Offensive Shape</span>${radar(["SHOT #8","RANGE #11","RIM #5","CREATE #4","PASS #7","PACE #18"],[76,67,83,88,78,49])}</div><div class="radar-wrap"><span class="radar-title">Defense + Roster</span>${radar(["POINT #12","WING #3","RIM #15","REBOUND #20","ATH #6","DEPTH #9"],[64,91,54,40,82,71])}</div></div>`, "identity compact-radar");
    const standingRows = [["BOS",35,11],["CLE",33,14],["NYK",31,15],["ORL",29,17],["WAS",28,19],["PHI",27,20],["MIA",25,21],["ATL",24,23],["MIL",22,25],["TOR",20,27]];
    const standings = () => panel("East Standings", `<table><thead><tr><th>#</th><th>Team</th><th>W–L</th><th>PCT</th><th>GB</th></tr></thead><tbody>${standingRows.map((r,i)=>`<tr class="${r[0]==="WAS"?"current-row":""} ${i===6?"play-in":""}"><td class="rank">${i+1}</td><td><span class="team-cell">${logo(r[0],"xs")} ${r[0]}</span></td><td>${r[1]}–${r[2]}</td><td>${(r[1]/(r[1]+r[2])).toFixed(3).replace("0.",".")}</td><td>${i?((standingRows[0][1]-r[1]+r[2]-standingRows[0][2])/2).toFixed(1):"—"}</td></tr>`).join("")}</tbody></table>`, "standings", button("West")+button("View All"));
    const players = [["Trae Young","PG",93,"26.4 PTS · 10.8 AST"],["Bilal Coulibaly","SF",84,"17.1 PTS · 5.8 REB"],["Alex Sarr","C",82,"15.8 PTS · 2.2 BLK"],["Tre Johnson","SG",80,"18.3 PTS · 4.1 AST"],["Kyshawn George","PF",76,"12.6 PTS · 6.4 REB"],["Bub Carrington","PG",74,"11.9 PTS · 5.2 AST"]];
    const core = () => panel("Core Six", `<div class="core-list">${players.map((p,i)=>`<div class="core-player">${logo("WAS","sm")}<div><div class="name">${p[0]}</div><small>${p[1]} · ${p[3]}</small></div><div class="ovr">${p[2]}</div></div>`).join("")}</div>`, "core", button("Full Roster"));
    const coreVertical = () => panel("Core Six", `<div class="core-vertical">${players.map((p,i)=>`<div class="core-v-row"><span class="slot">${i+1}</span><div><div class="name">${p[0]}</div><small>${p[1]} · ${p[3]}</small></div><i class="core-track"><i style="width:${p[2]}%"></i></i><span class="ovr">${p[2]}</span></div>`).join("")}</div>`, "core-v", button("Roster"));
    const staff = () => panel("Staff", `<div class="staff-list">${[["Head Coach","Elliot Lang",86],["Offensive Coordinator","Miles Calder",79],["Defensive Coordinator","Preston Cole",81],["Development Lead","Jonah Reeves",75]].map(s=>`<div class="staff-row"><div><span>${s[1]}</span><small>${s[0]}</small></div><em>${s[2]}</em></div>`).join("")}</div>`, "staff", button("Manage"));
    const staffStrip = () => panel("Staff", `<div class="staff-list">${[["HC","Elliot Lang",86],["OC","Miles Calder",79],["DC","Preston Cole",81],["DEV","Jonah Reeves",75]].map(s=>`<div class="staff-row"><div><span>${s[1]}</span><small>${s[0]}</small></div><em>${s[2]}</em></div>`).join("")}</div>`, "staff-strip", button("Manage"));
    const minuteRows = [["Trae Young","PG",35,"Healthy"],["Bilal Coulibaly","SF",33,"Healthy"],["Alex Sarr","C",32,"Healthy"],["Tre Johnson","SG",30,"Healthy"],["Kyshawn George","PF",28,"Healthy"],["Bub Carrington","PG",25,"Healthy"],["Marcus Smart","SG",21,"Healthy"],["Khris Middleton","SF",0,"Out 8"],["Richaun Holmes","C",16,"Healthy"]];
    const rotation = () => panel("Minutes + Availability", `<div class="rotation-list">${minuteRows.map(r=>`<div class="rotation-row ${r[3].startsWith("Out")?"injured":""}"><div><span class="name">${r[0]}</span><small>${r[1]}</small></div><span class="minutes">${r[2]}</span><i class="minute-track"><i style="width:${r[2]/36*100}%"></i></i><span class="minutes">${r[2]?`${r[2]}m`:"—"}</span><span class="status">${r[3]}</span></div>`).join("")}</div>`, "rotation", button("Edit"));
    const fullRoster = [["Trae Young","PG","",93,96,42,26.4,3.2,10.8,35],["Bilal Coulibaly","SF","",84,82,88,17.1,5.8,4.2,33],["Alex Sarr","C","",82,78,91,15.8,8.9,2.4,32],["Tre Johnson","SG","",80,87,66,18.3,4.1,4.1,30],["Kyshawn George","PF","",76,74,80,12.6,6.4,3.7,28],["Bub Carrington","PG","",74,78,61,11.9,3.3,5.2,25],["Marcus Smart","SG","",71,62,89,8.8,3.1,4.4,21],["Khris Middleton","SF","OUT — 8 GMS",70,76,64,14.2,4.7,4.8,0],["Richaun Holmes","C","",68,64,75,7.1,6.6,1.2,16],["Corey Kispert","SF","",67,79,48,8.4,2.3,1.1,10],["Justin Champagnie","SF","",64,61,69,4.9,3.1,0.8,6],["Tristan Vukcevic","C","",62,67,57,3.8,2.7,0.7,4],["AJ Johnson","SG","",59,63,51,1.6,0.9,0.8,0],["Pacome Dadiet","SF","",57,58,55,1.1,0.8,0.3,0],["Jared Butler","PG","",55,60,46,0.8,0.4,0.7,0],["Sidy Cissoko","SF","",54,52,58,0.0,0.0,0.0,0],["Colby Jones","SG","",52,50,55,0.0,0.0,0.0,0]];
    const tierColor = value => value >= 75 ? "var(--good)" : value >= 60 ? "var(--warn)" : value >= 45 ? "var(--orange)" : "var(--bad)";
    const ratingCell = (value, mode) => mode === "pill" ? `<span class="rating-pill" style="border-color:${tierColor(value)}">${value}</span>` : mode === "multi" ? `<span class="rating-stack"><i style="--rating:${value}%"></i>${value}</span>` : `${value}`;
    const minutesV2 = (mode="plain") => { const multi=mode==="multi"; return panel("Minutes + Availability", `<table class="minutes-table ${multi?"multi":""}"><thead><tr><th>Player</th><th>Position / Status</th><th>OVR</th>${multi?"<th>OFF</th><th>DEF</th>":""}<th>PTS</th><th>REB</th><th>AST</th><th>Minute Assignment</th><th>MPG</th></tr></thead><tbody>${fullRoster.map(r=>`<tr><td class="${r[2]?"injured-name":""}">${r[0]}</td><td><span class="position ${r[2]?"out":""}">${r[1]}${r[2]?` · ${r[2]}`:""}</span></td><td>${ratingCell(r[3],mode)}</td>${multi?`<td>${ratingCell(r[4],"multi")}</td><td>${ratingCell(r[5],"multi")}</td>`:""}<td>${r[6].toFixed(1)}</td><td>${r[7].toFixed(1)}</td><td>${r[8].toFixed(1)}</td><td><span class="minute-control"><i class="rail"><i style="width:${r[9]/36*100}%"></i></i><em>${r[9]}</em></span></td><td>${r[9] ? (r[9]-.4).toFixed(1) : "0.0"}</td></tr>`).join("")}</tbody></table>`, "minutes-panel", button("Edit Minutes")); };
    const fatigueLevels = [4,3,3,4,2,3,5,6,2,2,1,1,1,1,1,1,1];
    const fatigueCells = level => `<span class="fatigue-cells" title="Fatigue ${level}/6">${[1,2,3,4,5,6].map(i=>`<i class="${i<=level?"filled":""}"></i>`).join("")}</span>`;
    const miniRating = value => `<span class="mini-rating"><i style="--rating:${value}%"></i>${value}</span>`;
    const minutesV3 = () => panel("Minutes + Availability", `<table class="minutes-v3"><thead><tr><th>Player</th><th>Position</th><th>OVR</th><th>OFF</th><th>DEF</th><th>MPG</th><th>PTS</th><th>REB</th><th>AST</th><th>Fatigue</th><th>Minute Assignment</th></tr></thead><tbody>${fullRoster.map((r,i)=>`<tr class="${r[2]?"injured-row":""}"><td>${r[0]}</td><td><span class="position">${r[1]}${r[2]?` · ${r[2]}`:""}</span></td><td>${miniRating(r[3])}</td><td>${miniRating(r[4])}</td><td>${miniRating(r[5])}</td><td>${r[9]?(r[9]-.4).toFixed(1):"0.0"}</td><td>${r[6].toFixed(1)}</td><td>${r[7].toFixed(1)}</td><td>${r[8].toFixed(1)}</td><td>${fatigueCells(fatigueLevels[i])}</td><td><span class="assignment-meter"><i><i style="--minutes:${r[9]/36*100}%"></i></i><em>${r[9]}</em></span></td></tr>`).join("")}</tbody></table>`, "minutes-panel", button("Edit Minutes"));
    const identityV3 = () => panel("Team Identity", `<div class="identity-v3-body"><div class="identity-v3-visuals">${conceptSpatialHeatmap()}<div class="diagnostic-radars"><div class="radar-wrap"><span class="radar-title">Offensive Shape</span>${diagnosticRadar(["Shot #8","Range #11","Rim #5","Create #4","Pass #7","Pace #18"],[76,67,83,88,78,49],[80,72,85,90,81,52],"offense")}<div class="radar-key"><span><i></i>Minute plan</span><span><i class="baseline"></i>Full-health auto</span></div></div><div class="radar-wrap"><span class="radar-title">Defense + Roster</span>${diagnosticRadar(["Point #12","Wing #3","Rim #15","Rebound #20","Ath #6","Depth #9"],[64,91,54,40,82,71],[70,92,63,46,84,79],"defense")}<div class="radar-key"><span><i></i>Minute plan</span><span><i class="baseline"></i>Full-health auto</span></div></div></div></div><div class="identity-signals"><div class="signal-group"><div class="signal-label">League Position</div>${[["Overall",72,9,""],["Offense",81,6,""],["Defense",61,13,"warn"],["Depth",70,10,""]].map(r=>`<div class="signal-row ${r[3]}"><span>${r[0]}</span><i class="signal-track"><i style="width:${r[1]}%"></i></i><em>#${r[2]}/30</em></div>`).join("")}</div><div class="signal-group"><div class="signal-label">Morale</div>${[["Locker Room",78,""],["Coach Trust",71,""],["Owner",63,"warn"],["Fans",54,"low"]].map(r=>`<div class="signal-row ${r[2]}"><span>${r[0]}</span><i class="signal-track"><i style="width:${r[1]}%"></i></i><em>${r[1]}</em></div>`).join("")}</div></div></div>`, "identity-v3", button("Details"));
    const staffV3 = mode => {
      const staffData=[["Elliot Lang","Head Coach",86,"$8.6M × 3"],["Miles Calder","Offensive Coordinator",79,"$4.8M × 2"],["Preston Cole","Defensive Coordinator",81,"$5.1M × 2"],["Jonah Reeves","Development Lead",75,"$3.7M × 2"]];
