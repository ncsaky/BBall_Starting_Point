<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NBA GM - Interface Review</title>
  <style>
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:#0d0e10; color:#e3e5e7; font:13px "SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    header { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:20px; height:58px; padding:0 20px; background:#191c1f; border-bottom:1px solid #35393e; }
    h1 { font-size:16px; font-weight:400; margin:0; }
    header span { color:#9ba1a7; font-size:12px; flex:1; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible,input:focus-visible { outline:2px solid #b8d5ee; outline-offset:2px; }
    .return,.preview { padding:7px 10px; border:1px solid #4c535a; border-radius:2px; white-space:nowrap; }
    .return:hover,.preview:hover { background:#23272b; }
    nav { position:fixed; top:58px; bottom:0; left:0; width:218px; overflow:auto; padding:12px; border-right:1px solid #35393e; }
    nav input { width:100%; margin-bottom:10px; padding:9px; color:inherit; background:#191c1f; border:1px solid #35393e; font:inherit; }
    nav a { display:flex; gap:9px; padding:7px 4px; font-size:12px; }
    nav a:hover,nav a.active { background:#252c31; }
    nav a span { color:#9ba1a7; width:20px; }
    main { margin-left:218px; padding:10px 18px 24px; }
    article { scroll-margin-top:68px; margin-bottom:28px; }
    article > div { display:flex; align-items:center; gap:15px; min-height:54px; }
    h2 { font:14px inherit; font-weight:400; flex:1; margin:0; }
    h2 span { color:#9ba1a7; margin-right:12px; }
    img { display:block; width:100%; height:auto; border:1px solid #35393e; }
    [hidden] { display:none; }
    @media (max-width:850px) { nav{display:none} main{margin-left:0;padding:8px} header{padding:0 10px;gap:12px} header span{display:none} header h1{flex:1} }
    @media (prefers-reduced-motion:reduce) { html{scroll-behavior:auto} }
  </style>
</head>
<body>
  <header><h1>Interface review</h1><span>Production screens. Frozen sample data; phase scenarios are illustrative.</span><a class="return" href="/">Open game</a></header>
  <nav aria-label="Screens"><input type="search" aria-label="Find a screen" placeholder="Find a screen"><div id="index"></div></nav>
  <main id="screens"></main>
  <script>
    (async () => {
      const response = await fetch('/assets/interface-review/manifest.json');
      if (!response.ok) throw new Error('Screen captures are not available.');
      const screens = await response.json();
      const index = document.getElementById('index');
      const main = document.getElementById('screens');
      for (const [i,screen] of screens.entries()) {
        const number = String(i+1).padStart(2,'0');
        const anchor = document.createElement('a');
        anchor.href = `#${screen.id}`;
        anchor.innerHTML = `<span>${number}</span>`;
        anchor.append(screen.title);
        index.append(anchor);
        const article = document.createElement('article'); article.id=screen.id;
        const row=document.createElement('div');
        const title=document.createElement('h2'); title.innerHTML=`<span>${number}</span>`; title.append(screen.title);
        const preview=document.createElement('a'); preview.className='preview'; preview.href=`/?ui-review=${encodeURIComponent(screen.id)}`; preview.target='_blank'; preview.rel='noopener'; preview.textContent='Open preview';
        const img=document.createElement('img'); img.src=`/assets/interface-review/${screen.id}.png`; img.alt=screen.title; img.width=1682; img.height=963; img.loading=i<2?'eager':'lazy';
        row.append(title,preview); article.append(row,img); main.append(article);
      }
      document.querySelector('input').addEventListener('input',e=>{
        const value=e.target.value.toLowerCase().trim();
        screens.forEach(screen=>{const match=screen.title.toLowerCase().includes(value);document.getElementById(screen.id).hidden=!match;index.querySelector(`[href="#${screen.id}"]`).hidden=!match;});
      });
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{if(entry.isIntersecting){index.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.hash===`#${entry.target.id}`));}});
      },{rootMargin:'-58px 0px -60% 0px'});
      main.querySelectorAll('article').forEach(el=>observer.observe(el));
    })().catch(error=>{document.getElementById('screens').textContent=error.message;});
  </script>
</body>
</html>
