<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NBA GM Surface Studies</title>
  <style>
    :root { --page:#d8dddf; --bg:#090d10; --panel:#10161a; --raised:#151d22; --line:#2a353c; --ink:#edf2f4; --muted:#829097; --fill:#a6b5bc; --good:#52bd8a; --warn:#c4a94f; --bad:#ca6d68; --small:10px; --body:13px; --display:22px; }
    * { box-sizing:border-box; font-size:var(--body); font-weight:400 !important; }
    body { background:var(--page); color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; padding:28px; }
    button,select { color:inherit; font:inherit; } button { cursor:pointer; }
    .gallery { margin:auto; width:1440px; }
    .gallery-head { align-items:end; color:#172026; display:flex; justify-content:space-between; margin-bottom:22px; }
    .gallery-head h1,.display { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:var(--display); line-height:1.05; margin:0; }
    .gallery-head p { color:#576269; margin:6px 0 0; }
    .gallery-head nav { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:680px; }
    .gallery-head a,.copy { background:#fff; border:1px solid #aab4b8; color:#172026; font-size:var(--small); padding:8px 10px; text-decoration:none; }
    .concept { margin-bottom:48px; } .concept-label { align-items:center; color:#344047; display:flex; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; justify-content:space-between; margin-bottom:7px; } .concept-label span { font-size:var(--small); }
    .artboard { background:var(--bg); border:1px solid #39454c; color:var(--ink); height:900px; overflow:hidden; width:1440px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; } .small,.label,th,.button,.sub { font-size:var(--small); } .label { color:var(--muted); letter-spacing:.06em; text-transform:uppercase; } .sub { color:var(--muted); }
    .screen-head { align-items:center; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto 1fr; height:66px; padding:0 18px; }
    .brand,.team-lock { align-items:center; display:flex; gap:10px; } .screen-head .context { text-align:center; } .actions { display:flex; gap:6px; justify-content:flex-end; }
    .logo { height:36px; object-fit:contain; width:36px; } .logo.small-logo { height:25px; width:25px; }
    .button { align-items:center; background:transparent; border:1px solid var(--line); display:inline-flex; justify-content:center; min-height:31px; padding:6px 10px; text-transform:uppercase; }
    .button.primary { background:var(--ink); border-color:var(--ink); color:var(--bg); } .button.danger { border-color:var(--bad); color:var(--bad); }
    .panel { background:var(--panel); border:1px solid var(--line); min-height:0; overflow:hidden; }
    .panel-head { align-items:center; border-bottom:1px solid var(--line); display:flex; height:42px; justify-content:space-between; padding:0 12px; } .panel-head h2 { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin:0; }
    .panel-body { padding:12px; } .metric-grid { display:grid; gap:6px; grid-template-columns:repeat(3,1fr); } .metric { background:var(--raised); min-height:51px; padding:8px; } .metric span { color:var(--muted); display:block; font-size:var(--small); margin-bottom:5px; text-transform:uppercase; }
    .bar-list { display:grid; gap:8px; } .bar { align-items:center; display:grid; gap:7px; grid-template-columns:70px minmax(0,1fr) 30px; } .bar span,.bar em { color:var(--muted); font-size:var(--small); font-style:normal; }
    .track { background:#222c31; display:block; height:6px; overflow:hidden; } .track i { background:var(--fill); display:block; height:100%; }
    table { border-collapse:collapse; width:100%; } th,td { border-bottom:1px solid var(--line); height:36px; padding:5px 7px; text-align:right; white-space:nowrap; } th { color:var(--muted); letter-spacing:.03em; text-transform:uppercase; } th:first-child,td:first-child { text-align:left; }
    .name { color:var(--ink); } .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    .radar { height:100%; min-height:260px; width:100%; } .panel > .radar { height:calc(100% - 42px); min-height:0; } .radar polygon.grid { fill:none; stroke:#354149; } .radar polygon.shape { fill:#9daeb72a; stroke:var(--fill); stroke-width:2; } .radar line { stroke:#273139; } .radar text { fill:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .concept-grid { display:grid; gap:10px; height:calc(100% - 66px); padding:10px; } .concept-grid > * { min-height:0; } .scroll { min-height:0; overflow:hidden; } .large-number { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:var(--display); } .rule { border-top:1px solid var(--line); }
    .compact-list > div { align-items:center; border-bottom:1px solid var(--line); display:grid; gap:8px; min-height:43px; padding:5px 8px; } .compact-list .sub { display:block; margin-top:3px; }
    .year-bars { align-items:end; display:grid; gap:11px; grid-template-columns:repeat(4,1fr); height:100%; padding:42px 14px 30px; position:relative; } .year-bar { align-self:end; background:#59666d; min-height:20px; position:relative; } .year-bar::before { border-top:1px dashed var(--warn); content:""; left:-7px; position:absolute; right:-7px; top:-18px; } .year-bar::after { border-top:1px dashed var(--bad); content:""; left:-7px; position:absolute; right:-7px; top:-34px; } .year-bar span { bottom:-22px; color:var(--muted); font-size:var(--small); left:0; position:absolute; text-align:center; width:100%; } .cap-fill { display:grid; grid-template-rows:42px minmax(0,1fr); } .cap-fill > .year-bars { height:auto; } .offer-read { display:grid; grid-template-rows:42px auto auto minmax(0,1fr); } .offer-read > .year-bars { height:auto; min-height:150px; }
    .offer-row { align-items:center; border-bottom:1px solid var(--line); display:grid; gap:8px; grid-template-columns:30px 1fr auto; min-height:48px; padding:5px 7px; } .offer-row img { height:25px; object-fit:contain; width:25px; }
    .player-ledger { grid-template-columns:260px minmax(0,1fr) 430px; } .identity-panel { display:flex; flex-direction:column; padding:15px; } .identity-line { align-items:center; display:flex; justify-content:space-between; } .identity-panel .display { margin:18px 0 5px; } .identity-panel .metric-grid { grid-template-columns:1fr 1fr; margin-top:18px; } .identity-panel .availability { margin-top:auto; padding-top:14px; }
    .player-middle { display:grid; gap:10px; grid-template-rows:175px minmax(0,1fr); } .production { display:grid; grid-template-columns:repeat(5,1fr); padding:18px; } .production div { border-right:1px solid var(--line); padding:12px; } .production div:last-child { border-right:0; } .player-radar-side { display:grid; gap:10px; grid-template-rows:minmax(0,1fr) 250px; }
    .trait-atlas { grid-template-columns:minmax(0,1fr) 520px; grid-template-rows:180px minmax(0,1fr); } .trait-atlas .hero-strip { grid-column:1/-1; } .hero-strip { align-items:center; display:grid; gap:18px; grid-template-columns:75px 1.2fr repeat(4,1fr); padding:18px; } .hero-strip .logo { height:62px; width:62px; }
    .performance-sheet { grid-template-columns:minmax(0,1fr) 470px; } .performance-main { display:grid; gap:10px; grid-template-rows:190px minmax(0,1fr); }
    .negotiation { grid-template-columns:310px minmax(0,1fr) 350px; } .ask-panel { display:flex; flex-direction:column; padding:18px; } .ask-price { border-bottom:1px solid var(--line); border-top:1px solid var(--line); margin:18px 0; padding:22px 0; } .ask-price .display { margin-bottom:7px; }
    .term-controls { display:grid; gap:10px; grid-template-columns:1fr 1fr; padding:14px; } .term-box { background:var(--raised); padding:13px; } .stepper { align-items:center; display:grid; gap:5px; grid-template-columns:31px 1fr 31px; margin-top:12px; } .stepper button { background:transparent; border:1px solid var(--line); height:31px; } .stepper span { text-align:center; }
    .neg-actions { align-items:center; border-top:1px solid var(--line); display:flex; gap:7px; justify-content:flex-end; padding:12px; } .neg-actions .sub { margin-right:auto; } .terms-workspace { display:grid; grid-template-rows:auto minmax(0,1fr) auto; } .leverage-board { grid-template-columns:minmax(0,1fr) 430px; } .leverage-left { display:grid; gap:10px; grid-template-rows:150px minmax(0,1fr); } .ask-banner { align-items:center; display:grid; gap:14px; grid-template-columns:1fr auto auto; padding:18px; }
    .trade-exchange { grid-template-columns:360px minmax(0,1fr) 360px; } .asset-column { display:flex; flex-direction:column; } .tabs { border-bottom:1px solid var(--line); display:flex; gap:5px; padding:8px; } .asset-row { align-items:center; border-bottom:1px solid var(--line); display:grid; gap:7px; grid-template-columns:minmax(0,1fr) 46px 27px; min-height:47px; padding:5px 8px; } .asset-row.selected { background:var(--raised); border-left:2px solid var(--ink); } .asset-row button { background:transparent; border:1px solid var(--line); height:25px; width:25px; }
    .deal-center { display:grid; gap:10px; grid-template-rows:185px minmax(0,1fr) 44px; } .packages { display:grid; gap:10px; grid-template-columns:1fr 1fr; } .package { padding:12px; } .package > div { border-top:1px solid var(--line); padding:9px 0; } .value-balance { display:grid; gap:18px; padding:18px; } .balance-row { align-items:center; display:grid; gap:10px; grid-template-columns:75px minmax(0,1fr) 55px; } .legality-strip { align-items:center; border:1px solid var(--line); color:var(--good); display:flex; justify-content:space-between; padding:0 11px; }
    .trade-canvas { grid-template-rows:190px minmax(0,1fr); } .trade-canvas-top { display:grid; gap:10px; grid-template-columns:1fr 270px 1fr; } .asset-drawers { display:grid; gap:10px; grid-template-columns:1fr 1fr; } .trade-ledger { grid-template-columns:minmax(0,1fr) 430px; }
    .roster-ledger { grid-template-columns:minmax(0,1fr) 390px; } .roster-side { display:grid; gap:10px; grid-template-rows:420px minmax(0,1fr); } .depth-map { grid-template-columns:410px minmax(0,1fr); } .court { display:grid; gap:8px; grid-template-columns:1fr 1fr; padding:12px; } .court-slot { background:var(--raised); min-height:116px; padding:12px; } .court-slot:last-child { grid-column:1/-1; } .cap-roster { grid-template-columns:minmax(0,1fr) 470px; }
    .fa-study { grid-template-columns:minmax(0,1fr) 340px; } .fa-main { display:grid; grid-template-rows:50px minmax(0,1fr); } .fa-toolbar { align-items:center; border-bottom:1px solid var(--line); display:flex; gap:6px; padding:0 10px; } .fa-toolbar .sub { margin-left:auto; } .fa-side { display:grid; gap:8px; grid-template-rows:230px 140px 200px minmax(0,1fr); } .selected-head { align-items:baseline; display:flex; justify-content:space-between; margin-bottom:12px; } .selected-head .overall { color:#dffcff; font-size:var(--display); text-shadow:0 0 3px #69dce8,0 0 7px #bc8cff; } .fa-table td,.fa-table th { height:35px; } .fa-table .player { background:transparent; border:0; padding:0; }
  </style>
</head>
<body>
  <main class="gallery"><header class="gallery-head"><div><h1>NBA GM · Surface Studies</h1><p>Thirteen dense alternatives. Three type sizes. Normal weight throughout. No gradients.</p></div><nav><a href="#players">Player cards</a><a href="#negotiations">Negotiations</a><a href="#trades">Trade rooms</a><a href="#rosters">Rosters</a><a href="#free-agency">Free agency</a></nav></header><div id="concepts"></div></main>
  <script>
    const L=(team,extra="")=>`<img class="logo ${extra}" src="/assets/team_logos/${team}.png" alt="${team}" />`;
    const B=entries=>`<div class="bar-list">${entries.map(([label,value])=>`<div class="bar"><span>${label}</span><i class="track"><i style="width:${value}%"></i></i><em>${value}</em></div>`).join("")}</div>`;
    const R=(values=[82,68,91,74,60,86])=>{const cx=190,cy=160,r=122;const polygon=(scale=1)=>Array.from({length:6},(_,i)=>{const a=-Math.PI/2+i*Math.PI/3;return `${cx+Math.cos(a)*r*scale},${cy+Math.sin(a)*r*scale}`}).join(" ");const shape=values.map((v,i)=>{const a=-Math.PI/2+i*Math.PI/3;return `${cx+Math.cos(a)*r*v/100},${cy+Math.sin(a)*r*v/100}`}).join(" ");const labels=[[190,18,"SHOOT"],[338,86,"CREATE"],[338,246,"PASS"],[190,316,"DEF"],[18,246,"REBOUND"],[18,86,"ATH"]];return `<svg class="radar" viewBox="0 0 380 330">${[1,.75,.5,.25].map(s=>`<polygon class="grid" points="${polygon(s)}"/>`).join("")}${Array.from({length:6},(_,i)=>{const a=-Math.PI/2+i*Math.PI/3;return `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}"/>`}).join("")}<polygon class="shape" points="${shape}"/>${labels.map(([x,y,t])=>`<text x="${x}" y="${y}" text-anchor="middle">${t}</text>`).join("")}</svg>`};
    const H=(title,center,actions=["Close"])=>`<header class="screen-head"><div class="brand">${L("WAS")}<div><div class="display">${title}</div><div class="sub">Washington · 2027-28</div></div></div><div class="label context">${center}</div><div class="actions">${actions.map((a,i)=>`<button class="button ${i===actions.length-1&&a!=="Close"?"primary":""}">${a==="Close"?"×":a}</button>`).join("")}</div></header>`;
    const P=(title,body,cls="")=>`<section class="panel ${cls}"><div class="panel-head"><h2>${title}</h2></div>${body}</section>`;
    const rows=[["Trae Young","PG",28,"6'1\"",93,96,39,94,95,31,"$43.0M"],["Alex Sarr","C",22,"7'0\"",81,77,88,75,58,84,"$12.3M"],["Bilal Coulibaly","SF",23,"6'8\"",76,71,86,72,68,69,"$10.2M"],["Bub Carrington","SG",22,"6'4\"",73,76,66,79,81,47,"$5.1M"],["Corey Kispert","SF",28,"6'6\"",70,75,62,88,59,52,"$15.4M"],["Kyshawn George","PF",23,"6'8\"",69,65,74,71,61,73,"$3.7M"],["Tre Johnson","SG",20,"6'6\"",68,72,58,81,70,45,"$6.2M"],["AJ Johnson","PG",22,"6'5\"",64,66,58,70,71,39,"$3.1M"],["Justin Champagnie","SF",25,"6'6\"",62,59,67,68,54,70,"$2.4M"],["Tristan Vukcevic","C",24,"7'0\"",60,63,56,74,50,65,"$2.2M"],["Jordan Poole","SG",28,"6'4\"",59,68,42,82,76,28,"$31.8M"],["Marvin Bagley III","C",28,"6'10\"",58,59,55,42,44,76,"$4.1M"],["Anthony Gill","PF",34,"6'8\"",51,52,52,58,42,55,"$2.0M"],["Richaun Holmes","C",33,"6'10\"",49,48,54,21,35,68,"$3.2M"],["Johnny Davis","SG",25,"6'5\"",45,43,49,41,47,44,"$2.1M"]];
    const rosterTable=(limit=15)=>`<table><thead><tr><th>Player</th><th>Pos</th><th>Age</th><th>Ht</th><th>OVR</th><th>OFF</th><th>DEF</th><th>SPC</th><th>CRE</th><th>REB</th><th>Salary</th></tr></thead><tbody>${rows.slice(0,limit).map(r=>`<tr>${r.map((v,i)=>`<td class="${i===0?"name":i>=4&&i<=9&&Number(v)>=80?"good":i>=4&&i<=9&&Number(v)<50?"bad":""}">${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    const traits=[["Shooting",91],["Range",94],["Shot versatility",89],["Creation",95],["Handle",94],["Passing reads",97],["Rim pressure",73],["Defense",39],["Effort",42],["Navigation",35],["Rebounding",31],["Athleticism",78],["Stamina",91],["Scheme IQ",83],["Portability",86],["Playoff",84]];
    const assets=team=>team==="WAS"?[["Trae Young","PG · 93 OVR","88.2"],["Bilal Coulibaly","SF · 76 OVR","61.4"],["Alex Sarr","C · 81 OVR","79.7"],["2028 R1 WAS","Unprotected","63.2"],["2029 R1 WAS","Own pick","57.8"],["2030 swap right","Better of WAS / MIA","21.6"],["2028 R2 PHX","Owned by WAS","14.1"]]:[["Scottie Barnes","PF · 88 OVR","123.8"],["Brandon Ingram","SF · 82 OVR","72.3"],["Immanuel Quickley","PG · 79 OVR","66.9"],["2028 R1 TOR","Unprotected","61.0"],["2029 R1 TOR","Own pick","56.4"],["2030 swap grant","TOR grants better","−16.2"],["2028 R2 TOR","Own pick","13.8"]];
    const assetList=team=>`<div class="compact-list">${assets(team).map((r,i)=>`<div class="asset-row ${i===1||team==="TOR"&&i===0?"selected":""}"><div><span class="name">${r[0]}</span><span class="sub">${r[1]}</span></div><span class="mono">${r[2]}</span><button>${i===1||team==="TOR"&&i===0?"−":"+"}</button></div>`).join("")}</div>`;
    const years=(heights=[78,72,64,55])=>`<div class="year-bars">${heights.map((h,i)=>`<div class="year-bar" style="height:${h}%"><span>${2028+i}-${String(29+i).padStart(2,"0")}</span></div>`).join("")}</div>`;
    const add=(group,number,name,html)=>{let anchor=document.getElementById(group);if(!anchor){anchor=document.createElement("div");anchor.id=group;document.getElementById("concepts").append(anchor)}const section=document.createElement("section");section.className="concept";section.innerHTML=`<div class="concept-label"><span>CONCEPT ${number} · ${name.toUpperCase()}</span><button class="copy" data-copy="concept-${number}">Copy editable HTML</button></div><article class="artboard" id="concept-${number}" layer-name="Concept ${number} - ${name}">${html}</article>`;anchor.append(section)};

    add("players",27,"Player Ledger",`${H("Player Ledger","PLAYER CARD",["Compare","Close"])}<main class="concept-grid player-ledger"><aside class="panel identity-panel"><div class="identity-line">${L("WAS")}<span class="large-number">93 OVR</span></div><div class="display">Trae Young</div><div class="sub">PG · 6'1\" · age 28</div><div class="metric-grid"><div class="metric"><span>Minutes</span>35.4 MPG</div><div class="metric"><span>Upside</span>+1.4 OVR</div><div class="metric"><span>Contract</span>$47.2M AAV</div><div class="metric"><span>Games</span>46 / 48</div></div><div class="availability"><span class="label">Availability</span><div class="good" style="margin-top:7px">Healthy · injury risk 2.1</div></div></aside><div class="player-middle"><section class="panel production">${[["PTS","24.8"],["REB","3.1"],["AST","10.4"],["STL","1.2"],["TS%","61.4"]].map(x=>`<div><span class="label">${x[0]}</span><p class="large-number">${x[1]}</p></div>`).join("")}</section>${P("Rating Ledger",`<div class="panel-body">${B(traits)}</div>`)}</div><aside class="player-radar-side">${P("Player Shape",R([94,95,97,39,31,78]))}${P("Contract Runway",years([74,78,82,84]),"cap-fill")}</aside></main>`);
    add("players",28,"Trait Atlas",`${H("Trait Atlas","PLAYER CARD",["Game Log","Compare","Close"])}<main class="concept-grid trait-atlas"><section class="panel hero-strip">${L("WAS")}<div><div class="display">Trae Young</div><div class="sub">PG · 6'1\" · age 28 · healthy</div></div>${[["OVR","93"],["PTS","24.8"],["AST","10.4"],["AAV","$47.2M"]].map(x=>`<div><span class="label">${x[0]}</span><p class="large-number">${x[1]}</p></div>`).join("")}</section>${P("Complete Ratings",`<div class="panel-body">${B(traits)}</div>`)}${P("Shape and Translation",`<div style="height:510px">${R([94,95,97,39,31,78])}</div><div class="metric-grid panel-body"><div class="metric"><span>Upside</span>+1.4</div><div class="metric"><span>Portability</span>86</div><div class="metric"><span>Playoff</span>84</div></div>`)}</main>`);

    const negotiationHeader=H("Contract Negotiation","EXTENSION WINDOW",["Player Card","Close"]);
