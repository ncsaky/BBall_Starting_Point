<body>
  <main class="gallery">
    <header class="gallery-head"><div><h1>NBA GM Decision Surface Studies II</h1><p>Content-complete variants · 1440 × 900 · no gradients</p></div><nav id="nav"></nav></header>
    <div id="concepts"></div>

  <script>
    const logo=t=>`<img class="logo" src="assets/team_logos/${t}.png" alt="${t}"/>`;
    const header=(title,context,actions=[])=>`<header class="screen-head"><div class="brand">${logo("WAS")}<div><div class="display">${title}</div><div class="sub">Washington · 2027 offseason</div></div></div><div class="center"><div class="label">${context}</div></div><div class="actions">${actions.map(a=>`<button class="button ${a[1]||""}">${a[0]}</button>`).join("")}</div></header>`;
    const panel=(title,body,cls="")=>`<section class="panel ${cls}"><div class="panel-head"><h2>${title}</h2></div>${body}</section>`;
    const radar=(labels,values)=>{const pts=values.map((v,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length;const r=68*v/100;return `${100+Math.cos(a)*r},${88+Math.sin(a)*r}`}).join(" ");return `<svg class="radar" viewBox="0 0 200 176">${[.25,.5,.75,1].map(s=>`<polygon class="grid" points="${values.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length;return `${100+Math.cos(a)*68*s},${88+Math.sin(a)*68*s}`}).join(" ")}"/>`).join("")}${values.map((_,i)=>{const a=-Math.PI/2+i*Math.PI*2/values.length;return `<line x1="100" y1="88" x2="${100+Math.cos(a)*68}" y2="${88+Math.sin(a)*68}"/>`}).join("")}<polygon class="shape" points="${pts}"/>${labels.map((l,i)=>{const a=-Math.PI/2+i*Math.PI*2/labels.length;return `<text text-anchor="middle" x="${100+Math.cos(a)*87}" y="${91+Math.sin(a)*78}">${l}</text>`}).join("")}</svg>`};
    const traits=[["Release",89],["Range",94],["Shot versatility",88],["Rim pressure",91],["Handle",96],["Passing reads",97],["Foot speed",84],["Stamina",90],["Def effort",41],["Scheme IQ",55],["Rim deterrence",24],["Screen navigation",44],["Off rebounding",18],["Portability",82],["Playoff translation",84]];
    const ratingClass=v=>v>=75?"tier-opal":v>=50?"tier-green":v>=25?"tier-yellow":"tier-red";
    const bars=(colored=true)=>`<div class="ratings-grid">${traits.map(([l,v])=>`<div class="bar"><span>${l}</span><i class="track"><i style="width:${v}%"></i></i><em class="${colored?ratingClass(v):""}">${v}</em></div>`).join("")}</div>`;
    const radars=()=>`<div class="radar-pair"><div class="radar-wrap"><span>Offensive shape</span>${radar(["SHOT","RANGE","RIM","HANDLE","PASS","STAM"],[89,94,91,96,97,90])}</div><div class="radar-wrap"><span>Defense + translation</span>${radar(["FOOT","EFFORT","IQ","RIM","NAV","PLAYOFF"],[84,41,55,24,44,84])}</div></div>`;
    const seasonStats=()=>`<div class="stat-strip">${[["GP","76/82"],["MPG","35.2"],["PTS","24.8"],["REB","3.1"],["AST","10.4"],["STL","1.2"],["BLK","0.2"],["TS%","61.4"],["3P%","38.7"]].map(x=>`<div><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("")}</div>`;
    const capBars=()=>`<div class="cap-chart">${[["27-28",84,23],["28-29",88,25],["29-30",81,27],["30-31",75,29]].map(([y,h,p])=>`<div class="cap-year" style="--h:${h}%;--p:${p}%"><span class="player-slice"></span><small>${y}</small></div>`).join("")}</div><div class="contract-legend"><i></i>Trae Young share of team payroll · dashed lines: tax / hard cap</div>`;
    const salaries=()=>`<table class="salary-six"><thead><tr><th>Season</th><th>Salary</th><th>Status</th></tr></thead><tbody>${[["2027-28","$48.9M","Guaranteed"],["2028-29","$52.3M","Guaranteed"],["2029-30","$55.7M","Guaranteed"],["2030-31","$59.1M","Player option"],["2031-32","—","No contract"],["2032-33","—","No contract"]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    const recent=()=>`<table><thead><tr><th>Opponent</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>TS%</th><th>Result</th></tr></thead><tbody>${[["BOS",36,31,2,12,1,"64%","W"],["NYK",34,18,4,14,2,"51%","L"],["MIA",38,37,3,9,1,"69%","W"],["CLE",35,22,2,11,0,"57%","L"],["ORL",33,27,5,8,2,"63%","W"]].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

"DET").replace('class="logo"','class="logo sm"')}<div>Jaren Jackson Jr. · 88 OVR · age 27<small>$30.4M × 4</small></div><span>Day 2</span></div>`)}${panel("Four-Year Cap Position",capBars())}</aside></main>`);

    document.querySelectorAll(".copy").forEach(button=>button.addEventListener("click",async()=>{const source=document.getElementById(button.dataset.copy);const clone=source.cloneNode(true);const originals=[source,...source.querySelectorAll("*")];const clones=[clone,...clone.querySelectorAll("*")];originals.forEach((node,index)=>{const style=getComputedStyle(node);clones[index].setAttribute("style",Array.from(style).map(prop=>`${prop}:${style.getPropertyValue(prop)};`).join(""))});await navigator.clipboard.writeText(clone.outerHTML);const old=button.textContent;button.textContent="Copied";setTimeout(()=>button.textContent=old,1000)}));
